<style>

.lst .it .hero{width:44px;height:44px}
.lst .it .nm{flex:1;min-width:0}
.lst .it .nm b{display:block;overflow-wrap:anywhere}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:#fff;border-radius:12px;padding:8px 14px;font-weight:700;max-width:min(92vw,460px);text-align:center;z-index:70}
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:flex-start;justify-content:center;padding:32px 12px;z-index:60;overflow:auto}
.modal .card{max-width:480px;width:100%}
.pin{display:flex;justify-content:center;gap:12px;margin:4px 0}
.pin i{width:18px;height:18px;border-radius:50%;border:3px solid var(--vio)}
.pin i.on{background:var(--vio)}
.msg{white-space:pre-wrap;background:var(--soft);border-radius:12px;padding:8px 10px;font-size:.82rem;font-weight:600;max-height:160px;overflow:auto;overflow-wrap:anywhere}
footer{text-align:center;color:var(--muted);font-size:.76rem}
main.playing+footer{display:none}
#print{display:none}
@keyframes hit{0%{transform:translateX(0)}30%{transform:translateX(10px) rotate(6deg)}60%{transform:translateX(-6px)}100%{transform:none}}
@keyframes tease{0%,100%{transform:none}25%{transform:translateY(-10px)}50%{transform:none}75%{transform:translateY(-6px)}}

@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15);opacity:1}100%{transform:scale(1)}}
@media (prefers-reduced-motion:reduce){ *{animation:none!important;transition:none!important} }
@media (max-width:360px){ .kp button{height:52px} .brand{font-size:1.1rem} }

  body{background:#fff;padding:0;display:block}

  #print .tbl{font-size:9pt}
  #print .cert{border:3px double #7C3AED;border-radius:6mm;padding:8mm;text-align:center;margin-top:6mm}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

<script>
/* ================= INTI: Kalimon (fakta, jurus, status, jadwal, kode, gabung) ================= */
function mulberry32(a){ return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function hashStr(s){ let h=2166136261; for(const c of s){ h^=c.charCodeAt(0); h=Math.imul(h,16777619); } return h>>>0; }
function shuffle(a,r){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const DAY0=Date.UTC(2026,0,1);
function dayOf(dt){ dt=dt||new Date(); return Math.round((Date.UTC(dt.getFullYear(),dt.getMonth(),dt.getDate())-DAY0)/864e5); }
function minOf(dt){ dt=dt||new Date(); return dt.getHours()*60+dt.getMinutes(); }
function dateOf(d){ const t=new Date(DAY0+d*864e5); return `${t.getUTCDate()}/${t.getUTCMonth()+1}/${t.getUTCFullYear()}`; }

/* ---------- fakta: 55 pasangan perkalian a ≤ b (1–10); 0–54 = kali, 55–109 = bagi (keluarga fakta) ---------- */
const PAIRS=[], PI={};
for(let a=1;a<=10;a++) for(let b=a;b<=10;b++){ PI[a+"x"+b]=PI[b+"x"+a]=PAIRS.length; PAIRS.push([a,b]); }
const NP=PAIRS.length, NF=2*NP;
const pidx=(a,b)=>PI[a+"x"+b];
const pairOf=f=>PAIRS[f%NP];
const isDiv=f=>f>=NP;
const CORE=[3,4,6,7,8];
const isCore=(a,b)=>CORE.includes(a)&&CORE.includes(b);
const CORE_PAIRS=PAIRS.map((_,i)=>i).filter(i=>isCore(...PAIRS[i]));

/* ---------- urutan jurus (unit); tiap pasangan tepat di satu unit ---------- */
const UNITS=[
  {id:"u1",n:"×1 dan ×10",has:(a,b)=>a===1||b===10,extra:[[7,8]]},
  {id:"u2",n:"×2 kembar",has:(a,b)=>a===2&&b<10},
  {id:"u5",n:"×5",has:(a,b)=>(a===5||b===5)&&a>2&&b<10},
  {id:"u9",n:"×9",has:(a,b)=>b===9&&a>2&&a!==5},
  {id:"ubb",n:"Bolak-balik",has:()=>false},
  {id:"u3",n:"×3",has:(a,b)=>a===3&&isCore(a,b)},
  {id:"u4",n:"×4",has:(a,b)=>a===4&&isCore(a,b)},
  {id:"u6",n:"×6",has:(a,b)=>a===6&&isCore(a,b)},
  {id:"u8",n:"×8",has:(a,b)=>a===8&&b===8},
  {id:"u7",n:"7 × 7",has:(a,b)=>a===7&&b===7}
];
UNITS.forEach(u=>{ u.pairs=PAIRS.map((_,i)=>i).filter(i=>u.has(...PAIRS[i])).concat((u.extra||[]).map(([a,b])=>pidx(a,b))); });
const unitOfPair=p=>UNITS.findIndex(u=>u.pairs.includes(p));

/* ---------- status per fakta ---------- */
/* riwayat per fakta: [hari, hasil, desidetik, menit] — satu entri per hari (jawaban terakhir hari itu). hasil 0 = salah/lewati, 1 = benar lambat, 2 = benar cepat */
const HMAX=12;
const ST={BELUM:0,SALAH:1,LAMBAT:2,LANCAR:3,HAFAL:4};
function stat(c,f){ const H=c.h[f]; if(!H||!H.length) return ST.BELUM; const L=H[H.length-1];
  if(L[1]===0) return ST.SALAH; if(L[1]===1) return ST.LAMBAT;
  return H.filter(e=>e[1]===2).length>=3?ST.HAFAL:ST.LANCAR; }
const fastDays=(c,f)=>(c.h[f]||[]).filter(e=>e[1]===2).length;
function record(c,f,r,ds,d,m){ const H=c.h[f]||(c.h[f]=[]); const e=H.find(x=>x[0]===d);
  if(e){ if(m>=e[3]){ e[1]=r; e[2]=ds; e[3]=m; } }
  else { H.push([d,r,ds,m]); H.sort((x,y)=>x[0]-y[0]||x[3]-y[3]); if(H.length>HMAX) H.splice(0,H.length-HMAX); } }
/* jadwal ulang: salah → hari ini, lambat → besok, cepat → 1/2/4/7/14/30 hari sesuai jumlah hari cepat */
const IV=[1,2,4,7,14,30];
function dueDay(c,f){ const H=c.h[f]; if(!H||!H.length) return null; const L=H[H.length-1];
  if(L[1]===0) return L[0]; if(L[1]===1) return L[0]+1; return L[0]+IV[Math.min(fastDays(c,f),IV.length)-1]; }

function newChild(o){ o=o||{}; return {id:o.id||rid(),name:o.name||"Anak",hero:o.hero||{k:"kucing",c:0},grade:o.grade||3,h:{},units:0,test:false,tamed:0,evo:0,dl:false,uS:0,snap:null,ss:[],
  set:Object.assign({dur:10,thr:3,dx:15},o.set||{}),dv:o.dv||"auto",k:o.k||""}; }
function rid(){ const A="abcdefghjkmnpqrstuvwxyz23456789"; let s=""; for(let i=0;i<8;i++) s+=A[Math.floor(Math.random()*A.length)]; return s; }

const unitOn=(c,i)=>!!(c.units>>i&1);
const activeMul=c=>UNITS.flatMap((u,i)=>unitOn(c,i)?u.pairs:[]);
const masteredCore=c=>CORE_PAIRS.filter(p=>stat(c,p)===ST.HAFAL).length;
function divOpen(c,set){ if(c.dv==="open") return true; if(c.dv==="lock") return false; return masteredCore(c)>=set.dx; }
const activeDiv=c=>PAIRS.map((_,p)=>p).filter(p=>stat(c,p)>=ST.LANCAR).map(p=>NP+p);
function countStat(c,div){ const n=[0,0,0,0,0]; for(let p=0;p<NP;p++) n[stat(c,div?NP+p:p)]++; return n; }
function refreshBadges(c){ let t=c.tamed,e=c.evo; MON.forEach((m,i)=>{ if(stat(c,m.pi)===ST.HAFAL) t|=1<<i; if(stat(c,NP+m.pi)===ST.HAFAL&&(t>>i&1)) e|=1<<i; }); const nt=t&~c.tamed, ne=e&~c.evo; c.tamed=t; c.evo=e; return {nt,ne}; }
const bits=n=>{ let k=0; while(n){ k+=n&1; n>>>=1; } return k; };

/* ---------- jurus berikutnya ---------- */
function nextLesson(c,set){ const i=UNITS.findIndex((_,k)=>!unitOn(c,k));
  if(i===0) return "u1";
  if(!c.dl&&divOpen(c,set)) return "ud";
  if(i>0){ const act=activeMul(c), ok=act.filter(f=>stat(c,f)>=ST.LANCAR).length;
    if(!act.length||ok/act.length>=0.7||c.ss.length-c.uS>=3) return UNITS[i].id; }
  return null; }
function learnLesson(c,id){ if(id==="ud"){ c.dl=true; return; } const i=UNITS.findIndex(u=>u.id===id); if(i>=0){ c.units|=1<<i; c.uS=c.ss.length; } }

/* ---------- pilihan soal ---------- */
function testFacts(r){ const pick=(arr,n)=>shuffle(arr.slice(),r).slice(0,n);
  const u=id=>UNITS.find(x=>x.id===id).pairs.filter(p=>!monOfPair(p));
  return shuffle(CORE_PAIRS.concat(pick(u("u1"),2),pick(u("u2"),3),pick(u("u5"),3),pick(u("u9"),2)),r); }
function warmFacts(c,set,today,lim){ const pool=activeMul(c).concat(c.dl&&divOpen(c,set)?activeDiv(c):[]);
  return pool.map(f=>({f,d:dueDay(c,f)})).filter(x=>x.d!=null&&x.d<=today&&(c.h[x.f]||[]).some(e=>e[0]<today))
    .sort((x,y)=>x.d-y.d||stat(c,x.f)-stat(c,y.f)).slice(0,lim).map(x=>x.f); }
function pools(c,set,r){
  const act=activeMul(c).concat(c.dl&&divOpen(c,set)?activeDiv(c):[]);
  const unk=act.filter(f=>stat(c,f)<ST.LANCAR), kn=shuffle(act.filter(f=>stat(c,f)>=ST.LANCAR),r);
  if(unk.length){ let last=-1; UNITS.forEach((u,i)=>{ if(unitOn(c,i)&&u.pairs.length) last=i; });
    const inLast=f=>!isDiv(f)&&last>=0&&UNITS[last].pairs.includes(f);
    const A=shuffle(unk.filter(inLast),r).sort((x,y)=>(monOfPair(y%NP)?1:0)-(monOfPair(x%NP)?1:0));
    const order=[ST.SALAH,ST.BELUM,ST.LAMBAT];
    const B=shuffle(unk.filter(f=>!inLast(f)),r).sort((x,y)=>(isDiv(x)-isDiv(y))||order.indexOf(stat(c,x))-order.indexOf(stat(c,y)));
    return {mode:"learn",newQ:A.concat(B),known:kn}; }
  const w=act.slice().sort((x,y)=>fastDays(c,x)-fastDays(c,y)||lastDs(c,y)-lastDs(c,x)).slice(0,6);
  return {mode:"sarang",newQ:w,known:kn.filter(f=>!w.includes(f))}; }
const lastDs=(c,f)=>{ const H=c.h[f]; return H&&H.length?H[H.length-1][2]:0; };
function slowest(c,n,div){ const fs=[]; for(let p=0;p<NP;p++){ const f=div?NP+p:p, s=stat(c,f); if(s===ST.SALAH||s===ST.LAMBAT) fs.push(f); }
  return fs.sort((x,y)=>stat(c,x)-stat(c,y)||lastDs(c,y)-lastDs(c,x)).slice(0,n); }

/* ---------- penjadwal dalam sesi (incremental rehearsal) ---------- */
/* batas fakta baru (cap) hanya untuk fakta yang tidak bebas; fakta berpola (×1, ×10, ×2, ×5, ×9) bebas karena jurusnya sudah menyelesaikannya */
function Drill(o){ this.newQ=o.newQ.slice(); this.known=o.known.slice(); this.cap=o.cap; this.free=o.free||(()=>false); this.active=[]; this.intro=0; this.n=0; this.wrong=[]; this.lastF=-1; this.ki=0; this.done=[]; }
Drill.prototype._pick=function(f,kind){ this.n++; this.lastF=f; this.active.forEach(a=>{ a.since=a.f===f?0:a.since+1; }); return {f,kind}; };
Drill.prototype.next=function(){
  const wi=this.wrong.findIndex(x=>x.at<=this.n&&x.f!==this.lastF);
  if(wi>=0) return this._pick(this.wrong.splice(wi,1)[0].f,"ulang");
  while(this.active.length<2&&this.newQ.length){ const capOK=this.intro<this.cap||!this.known.length, i=capOK?0:this.newQ.findIndex(f=>this.free(f)); if(i<0) break;
    const f=this.newQ.splice(i,1)[0]; this.active.push({f,gap:0,since:99,ok:0,seen:0}); if(!this.free(f)) this.intro++; }
  const ready=this.active.filter(a=>a.since>=a.gap&&a.f!==this.lastF).sort((x,y)=>y.since-x.since)[0];
  if(ready) return this._pick(ready.f,"baru");
  for(let t=0;t<this.known.length;t++){ const f=this.known[this.ki++%this.known.length]; if(f!==this.lastF&&!this.active.some(a=>a.f===f)) return this._pick(f,"kenal"); }
  const any=this.active.find(a=>a.f!==this.lastF); if(any) return this._pick(any.f,"baru");
  const w=this.wrong.find(x=>x.f!==this.lastF); if(w){ this.wrong.splice(this.wrong.indexOf(w),1); return this._pick(w.f,"ulang"); }
  return null; };
Drill.prototype.answer=function(f,r){ const a=this.active.find(x=>x.f===f);
  if(r===0){ if(!this.wrong.some(x=>x.f===f)) this.wrong.push({f,at:this.n+2}); if(a){ a.gap=1; a.ok=0; a.seen++; } return; }
  if(!a) return; a.seen++; if(r===2){ a.ok++; a.gap=Math.min(a.gap+1,3); }
  if(a.ok>=2||a.seen>=6){ this.active.splice(this.active.indexOf(a),1); this.done.push(f); if(!this.known.includes(f)) this.known.push(f); } };

/* ---------- soal & petunjuk ---------- */
function question(f,r){ const [a,b]=pairOf(f), P=a*b;
  if(!isDiv(f)){ const sw=a!==b&&r()<.5; return {f,op:"×",x:sw?b:a,y:sw?a:b,ans:P,text:`${sw?b:a} × ${sw?a:b}`}; }
  const d=a!==b&&r()<.5?b:a, q=P/d; return {f,op:":",x:P,y:d,ans:q,text:`${P} : ${d}`}; }
/* langkah jurus: tiap langkah [ekspresi, nilai] supaya bisa dicek */
function hintMul(a,b){ if(a>b) [a,b]=[b,a]; const P=a*b;
  if(a===1) return {j:"×1",t:"Dikali 1, angkanya tetap.",s:[[`1 × ${b}`,b]]};
  if(b===10) return {j:"×10",t:"Dikali 10: tempel nol di belakang.",s:[[`${a} × 10`,P]]};
  if(a===7&&b===8) return {j:"5-6-7-8",t:"Ingat urutan 5, 6, 7, 8: 56 = 7 × 8.",s:[["7 × 8",56]]};
  if(a===2) return {j:"×2 kembar",t:`Kembar: ${b} ditambah ${b}.`,s:[[`${b} + ${b}`,P]]};
  if(a===5||b===5){ const n=a===5?b:a; return {j:"×5",t:`Setengah dari ${n} × 10.`,s:[[`${n} × 10`,n*10],[`${n*10} : 2`,P]]}; }
  if(b===9){ const n=a; return {j:"×9",t:`${n} × 10, lalu kurangi ${n}.`,s:[[`${n} × 10`,n*10],[`${n*10} − ${n}`,P]]}; }
  if(a===7&&b===7) return {j:"7 × 7",t:"7 × 5 ditambah 7 × 2.",s:[["7 × 5",35],["7 × 2",14],["35 + 14",49]]};
  if(a===3) return {j:"×3",t:`×2, lalu tambah satu kelompok ${b}.`,s:[[`${b} × 2`,2*b],[`${2*b} + ${b}`,P]]};
  if(a===4) return {j:"×4",t:"Dobel, lalu dobel lagi.",s:[[`${b} + ${b}`,2*b],[`${2*b} + ${2*b}`,P]]};
  if(a===6) return {j:"×6",t:`×5, lalu tambah satu kelompok ${b}.`,s:[[`${b} × 5`,5*b],[`${5*b} + ${b}`,P]]};
  return {j:"×8",t:"Dobel tiga kali.",s:[[`${a} + ${a}`,2*a],[`${2*a} + ${2*a}`,4*a],[`${4*a} + ${4*a}`,P]]}; }
function hintFor(q){ if(q.op==="×") return hintMul(q.x,q.y);
  const h=hintMul(q.y,q.ans); return {j:"keluarga fakta",t:`Cari: ${q.y} × berapa = ${q.x}?`,s:h.s.concat([[`${q.y} × ${q.ans}`,q.x],[`${q.x} : ${q.y}`,q.ans]])}; }

/* ---------- kode kemajuan (tanpa server): biner ringkas → base64url ---------- */
function b64e(u8){ let s=""; for(const x of u8) s+=String.fromCharCode(x); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
function b64d(s){ s=s.replace(/-/g,"+").replace(/_/g,"/"); while(s.length%4) s+="="; const t=atob(s); return Uint8Array.from(t,ch=>ch.charCodeAt(0)); }
const utf8e=s=>new TextEncoder().encode(s), utf8d=u=>new TextDecoder().decode(u);
/* type: "p" = dari rumah ke HP guru, "u" = dari guru ke HP rumah (undangan/pembaruan) */
function encodeChild(c,type,today){
  const ss=c.ss.filter(s=>today-s[0]>=0&&today-s[0]<256).slice(-40).map(s=>[today-s[0],s[1],s[2],s[3],s[4],s[5]]);
  const meta={id:c.id,n:c.name,hr:[c.hero.k==="kapi"?1:0,c.hero.c],g:c.grade,u:c.units,te:c.test?1:0,tm:c.tamed,ev:c.evo,dl:c.dl?1:0,us:c.uS,
    sn:c.snap&&today-c.snap.d>=0&&today-c.snap.d<256?[today-c.snap.d,c.snap.st]:0,ss,k:c.k,st:[c.set.dur,c.set.thr,c.set.dx],dv:c.dv};
  const mj=utf8e(JSON.stringify(meta)), ent=[];
  for(let f=0;f<NF;f++) for(const e of c.h[f]||[]){ const o=today-e[0]; if(o<0||o>255) continue; ent.push(f,o,(e[1]<<6)|Math.min(63,e[2]),e[3]>>8,e[3]&255); }
  const out=new Uint8Array(6+mj.length+ent.length+2);
  out.set([1,type==="u"?2:1,today>>8,today&255,mj.length>>8,mj.length&255],0); out.set(mj,6); out.set(ent,6+mj.length);
  let ck=0; for(let i=0;i<out.length-2;i++) ck=(ck+out[i]*(i%7+1))&65535; out[out.length-2]=ck>>8; out[out.length-1]=ck&255;
  return b64e(out); }
function decodeChild(str){
  const m=/[#&?]?([pu])=([A-Za-z0-9_-]{16,})/.exec(String(str).trim()); const raw=m?m[2]:String(str).trim();
  let u; try{ u=b64d(raw); }catch(e){ return null; } if(u.length<10||u[0]!==1) return null;
  let ck=0; for(let i=0;i<u.length-2;i++) ck=(ck+u[i]*(i%7+1))&65535; if(ck!==(u[u.length-2]<<8|u[u.length-1])) return null;
  const type=u[1]===2?"u":"p", today=u[2]<<8|u[3], ml=u[4]<<8|u[5]; let meta; try{ meta=JSON.parse(utf8d(u.slice(6,6+ml))); }catch(e){ return null; }
  const c=newChild({id:meta.id,name:meta.n,hero:{k:meta.hr&&meta.hr[0]?"kapi":"kucing",c:meta.hr?meta.hr[1]:0},grade:meta.g,k:meta.k,dv:meta.dv,set:meta.st?{dur:meta.st[0],thr:meta.st[1],dx:meta.st[2]}:{}});
  c.units=meta.u|0; c.test=!!meta.te; c.tamed=meta.tm|0; c.evo=meta.ev|0; c.dl=!!meta.dl; c.uS=meta.us|0;
  c.snap=meta.sn?{d:today-meta.sn[0],st:meta.sn[1]}:null; c.ss=(meta.ss||[]).map(s=>[today-s[0],s[1],s[2],s[3],s[4],s[5]]);
  for(let i=6+ml;i+4<u.length-2;i+=5){ const f=u[i]; if(f>=NF) return null; (c.h[f]=c.h[f]||[]).push([today-u[i+1],u[i+2]>>6,u[i+2]&63,u[i+3]<<8|u[i+4]]); }
  for(const f in c.h) c.h[f].sort((x,y)=>x[0]-y[0]||x[3]-y[3]);

    ${tam&&st<ST.HAFAL?`<small>Perlu dilatih lagi</small>`:""}${ev?`<small>✨ Berevolusi: pembagiannya hafal</small>`:""}</div>`; }

/* ---------- sesi bermain ---------- */
let G=null;
const KEYS=["1","2","3","4","5","6","7","8","9","skip","0","del"];
const kpHTML=()=>`<div class="kp" id="kp">${KEYS.map(k=>`<button type="button" data-k="${k}"${k.length>1?' class="fn"':""}>${k==="skip"?"Lewati":k==="del"?"⌫":k}</button>`).join("")}</div>`;
ACT.start=d=>startSession(kidOf(d.id),false); ACT.bonus=d=>startSession(kidOf(d.id),true);
function startSession(k,bonus){ const set=setOf(k), min=bonus?2:sesMin(k);
  G={k,set,bonus,min,dur:min*60000,t0:performance.now(),m0:minOf(),plan:[],n:0,nf:0,nw:0,touched:{},retried:{},retry:[],items:[],lesson:null,learned:false,tam0:k.tamed,evo0:k.evo,div0:divOpen(k,set),q:null,lock:true};
  if(bonus) G.plan=["drill"]; else { if(!k.test) G.plan.push("test"); G.plan.push("warm"); G.lesson=nextLesson(k,set); if(G.lesson) G.plan.push("lesson"); G.plan.push("drill"); }
  SCR={name:"play",arg:k.id}; APP.className="playing";
  APP.innerHTML=`<div class="ptop"><span class="phase" id="ph"></span><div class="tbar"><i id="tfill"></i></div><span class="tleft" id="tleft"></span><button type="button" class="xbtn" data-a="quit" aria-label="Akhiri sesi">✕</button></div><div id="pbody" style="display:flex;flex-direction:column;gap:10px;flex:1"></div>`;
  G.tick=setInterval(drawTime,250); drawTime(); nextPhase(); }
const elapsed=()=>performance.now()-G.t0;
function drawTime(){ if(!G) return; const left=Math.max(0,G.dur-elapsed()); $("tfill").style.transform=`scaleX(${left/G.dur})`; const s=Math.ceil(left/1000); $("tleft").textContent=`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`; }
const PHN={test:"Tes Awal",warm:"Pemanasan",lesson:"Jurus Baru",drill:"Latihan"};
function nextPhase(){ G.phase=G.plan.shift(); if(!G.phase) return endSession(false);
  $("ph").textContent=G.bonus?"Ronde Bonus":PHN[G.phase]; G.ps=elapsed();
  if(G.phase==="test"){ G.items=testFacts(rnd()); G.cap=Math.min(180000,G.dur*.6); return advance(); }
  if(G.phase==="warm"){ G.items=warmFacts(G.k,G.set,today(),8); G.cap=G.dur*.2; if(!G.items.length) return nextPhase(); return advance(); }
  if(G.phase==="lesson") return showLesson(0,0);
  if(G.phase==="drill"){ let P=pools(G.k,G.set,rnd()); if(G.bonus&&P.mode==="learn"&&P.known.length>=4) P={mode:"bonus",newQ:[],known:P.known};
    G.drill=new Drill({newQ:P.newQ,known:P.known,cap:G.bonus?0:G.min>=10?4:G.min>=5?3:2,free:f=>!monOfPair(f%NP)}); G.mode=P.mode; return advance(); } }
function advance(){ const el=elapsed();
  if(G.phase==="test"){ if(!G.items.length||el-G.ps>=G.cap||el>=G.dur) return finishTest(); return ask(G.items.shift()); }
  if(G.phase==="warm"){ if(el>=G.dur) return endSession(false); const f=G.items.length&&el-G.ps<G.cap?G.items.shift():G.retry.shift(); if(f==null) return nextPhase(); return ask(f); }
  if(G.phase==="drill"){ if(el>=G.dur) return endSession(false); const q=G.drill.next(); if(!q) return endSession(false); return ask(q.f); } }
function finishTest(){ G.k.test=true; G.touched={}; /* "mulai lancar" dihitung setelah tes, bukan hasil tes */ if(!G.k.snap) G.k.snap={d:today(),st:snapOf(G.k)}; save(); const n=countStat(G.k);
  $("pbody").innerHTML=`<div class="card center"><h2>Ini peta perkalianmu sekarang</h2>${mapHTML(G.k,{small:true})}${legendHTML()}
    <div class="stat"><div><b>${n[3]+n[4]}</b><small>sudah lancar</small></div><div><b>${n[2]}</b><small>benar tapi lambat</small></div><div><b>${n[1]}</b><small>belum bisa</small></div></div>
    <p class="sub">Tenang, kita pakai jurus supaya yang perlu dihafal jauh lebih sedikit.</p><button type="button" class="btn go" data-a="cont">Lanjut ⚔️</button></div>`; }
ACT.cont=()=>{ if(elapsed()>=G.dur) return endSession(false); nextPhase(); };
function stageHTML(q){ const m=monOfPair(q.f%NP);
  if(m&&G.phase!=="test"){ const fd=Math.min(3,fastDays(G.k,q.f)), tm=G.k.tamed>>m.i&1, ev=G.k.evo>>m.i&1;
    return `<span class="who">${isDiv(q.f)?(ev?"✨ Sudah berevolusi":tm?"✨ Menuju evolusi":"Kalimon liar"):tm?"Kalimon jinak":"Kalimon liar"}: ${m.nm}</span><span class="hp">${hearts(fd)}</span>${heroSVG(G.k.hero)}<span id="mon">${monSVG(m,{evo:!!ev})}</span>`; }
  const [a,b]=pairOf(q.f); return `<span class="who">${G.phase==="test"?"Tes awal: jawab yang kamu bisa":isDiv(q.f)?"Jurus keluarga fakta":"Jurus "+esc(hintMul(a,b).j)}</span>${heroSVG(G.k.hero,"hero")}`; }
function blanksHTML(){ const L=String(G.q.ans).length; let s=""; for(let i=0;i<L;i++) s+=`<span class="${i===G.typed.length?"cur":""}">${G.typed[i]||""}</span>`; return s; }
function ask(f){ const q=question(f,rnd()); G.q=q; G.typed=""; G.lock=false; G.les=null;
  $("pbody").innerHTML=`<div class="stage" id="stage">${stageHTML(q)}</div><div class="qcard" id="qcard"><span class="qtxt">${q.text} =</span><span class="blanks" id="blanks">${blanksHTML()}</span></div><div class="fb" id="fb"></div><div id="solw"></div>${kpHTML()}`;
  G.qT=performance.now(); }
function press(k){ if(!G||G.lock||!G.q) return;
  if(k==="del") G.typed=G.typed.slice(0,-1); else if(k==="skip") return G.les?lessonJudge(null):judge(null);
  else if(/^\d$/.test(k)&&G.typed.length<String(G.q.ans).length) G.typed+=k;
  $("blanks").innerHTML=blanksHTML();
  if(G.typed.length===String(G.q.ans).length) return G.les?lessonJudge(+G.typed):judge(+G.typed); }
const dtk=ms=>String(Math.round(ms/100)/10).replace(".",",");
function judge(v){ G.lock=true; const q=G.q, ms=performance.now()-G.qT, ok=v===q.ans, r=ok?(ms<=G.set.thr*1000?2:1):0;
  if(!(q.f in G.touched)) G.touched[q.f]=stat(G.k,q.f);
  record(G.k,q.f,r,Math.min(255,Math.round(ms/100)),today(),minOf()); save();
  G.n++; if(r===2) G.nf++; if(r===0) G.nw++;
  if(G.phase==="drill") G.drill.answer(q.f,r);
  if(G.phase==="warm"&&r===0&&!G.retried[q.f]){ G.retried[q.f]=1; G.retry.push(q.f); }
  const card=$("qcard"), mon=$("mon");
  if(r>0){ card.classList.add(r===2?"ok":"slow"); $("fb").innerHTML=r===2?`<span class="ok">⚡ Kilat! ${dtk(ms)} detik</span>`:`<span class="slow">Benar! ${dtk(ms)} detik. Coba lebih cepat.</span>`;
    if(mon) mon.firstChild.classList.add("hit"); setTimeout(advance,r===2?450:850); return; }
  card.classList.add("no"); if(mon) mon.firstChild.classList.add("tease");
  if(G.phase==="test"){ $("fb").innerHTML=`<span class="no">Jawabannya ${q.ans}</span>`; setTimeout(advance,900); return; }
  const h=hintFor(q);
  $("solw").innerHTML=`<div class="sol"><div><b class="ans">${q.text} = ${q.ans}</b></div><div><b>Jurus ${esc(h.j)}:</b> ${esc(h.t)}</div><div class="steps">${h.s.map(([e,v])=>`<span>${e} = ${v}</span>`).join("")}</div><button type="button" class="btn" data-a="solNext">Lanjut</button></div>`;
  $("kp").hidden=true; G.solT=performance.now(); }
/* abaikan klik sisa dari ketukan angka terakhir (kotak solusi muncul di tempat papan angka) */
ACT.solNext=()=>{ if(G&&performance.now()-(G.solT||0)<400) return; advance(); };
/* pelajaran jurus */
function showLesson(pi,qi){ const L=LESSONS[G.lesson], pg=L.p[pi]; G.les={pi,qi}; G.lock=false;
  const qq=pg.q[qi]; G.q=qq?{ans:qq[1],text:qq[0]}:null; G.typed="";
  $("pbody").innerHTML=`<div class="card lesson"><h2>🥋 ${esc(L.t)}</h2><p class="sub">Halaman ${pi+1} dari ${L.p.length}</p>
    ${pg.mon!=null?`<div class="celebrate">${monSVG(MON[pg.mon])}<b>Kalimon pertama: ${MON[pg.mon].nm}!</b></div>`:""}
    ${visSVG(pg.v,{kid:G.k})}<p class="ltxt">${pg.x}</p></div>
    ${qq?`<div class="qcard" id="qcard"><span class="qtxt">${qq[0]} =</span><span class="blanks" id="blanks">${blanksHTML()}</span></div><div class="fb" id="fb"></div>${kpHTML()}`
      :`<button type="button" class="btn go" data-a="lesNext">${pi+1<L.p.length?"Lanjut →":"Mulai latihan ⚔️"}</button>`}`;
  G.qT=performance.now(); }
function lessonJudge(v){ G.lock=true; const ok=v===G.q.ans; $("qcard").classList.add(ok?"ok":"no");
  $("fb").innerHTML=ok?`<span class="ok">Betul!</span>`:`<span class="no">${G.q.text} = ${G.q.ans}</span>`;
  setTimeout(()=>{ const pg=LESSONS[G.lesson].p[G.les.pi]; if(G.les.qi+1<pg.q.length) showLesson(G.les.pi,G.les.qi+1); else ACT.lesNext(); },ok?600:1500); }
ACT.lesNext=()=>{ const L=LESSONS[G.lesson]; if(G.les&&G.les.pi+1<L.p.length) return showLesson(G.les.pi+1,0);

  if(!confirm(`Ganti semua data di HP ini dengan cadangan (${Object.keys(o.kids).length} anak)?`)) return; D=o; save(); guruOK=false; homeScreen(); toast("Cadangan dipulihkan."); }; r.readAsText(f); }

/* ---------- rapor ---------- */
function raporHTML(k,print){ const set=setOf(k), dv=divOpen(k,set), n=countStat(k), nd=countStat(k,true), c=clsOf(k.id);
  const kk=sesCount(k,"k",30), kr=sesCount(k,"r",30), allDone=n[4]===55;
  return `<h1>Rapor Kalimon · ${esc(k.name)}</h1><p class="sub">${esc(c?c.name:k.k||"Latihan di rumah")} · kelas ${k.grade} SD · dicetak ${dateOf(today())}</p>
    <div class="stat"><div><b>${bits(k.tamed)}/15</b><small>Kalimon jinak (fakta inti hafal)</small></div><div><b>${n[3]+n[4]}/55</b><small>fakta perkalian lancar</small></div><div><b>${n[4]}/55</b><small>fakta hafal (3 hari)</small></div></div>
    <div class="${print?"two":""}">${k.snap?`<div><h2>Peta awal · ${dateOf(k.snap.d)}</h2>${mapHTML(null,{snap:k.snap.st})}</div>`:""}<div><h2>Peta sekarang</h2>${mapHTML(k)}</div></div>${legendHTML()}
    <h2>Pembagian</h2><p>${dv?`Terbuka${k.dv==="open"?" (dibuka guru)":""}. ${nd[3]+nd[4]}/55 fakta pembagian lancar, ${nd[4]} hafal.`:(k.dv==="lock"?`Dikunci oleh Kakak Guru (syarat otomatis kelas: ${set.dx}/15 Kalimon jinak; sekarang ${masteredCore(k)}).`:`Terkunci. Terbuka otomatis setelah ${set.dx}/15 Kalimon jinak (sekarang ${masteredCore(k)}).`)}</p>
    ${dv&&k.dl?mapHTML(k,{div:true,small:!print}):""}
    <h2>Latihan 30 hari terakhir</h2><p>Di kelas: <b>${kk.length} sesi</b> (${mins(kk)} menit) · di rumah: <b>${kr.length} sesi</b> (${mins(kr)} menit).</p>
    <h2>Perlu dilatih</h2><p>${slowest(k,6).map(f=>{ const [a,b]=pairOf(f); return `${factTxt(f)} <small>(jurus ${hintMul(a,b).j})</small>`; }).join(" · ")||"Tidak ada. Hebat!"}</p>
    <h2>Kalidex</h2><p>${MON.map((m,i)=>`<span class="nw">${k.tamed>>i&1?"✅":"⬜"} ${m.nm} (${m.p[0]} × ${m.p[1]})${k.evo>>i&1?" ✨":""}</span>`).join(" · ")}</p>
    ${allDone?`<div class="cert"><h1>🏆 Sertifikat Penjinak Kalimon</h1><p>${esc(k.name)} sudah hafal seluruh perkalian 1–10 (benar ≤ ${set.thr} detik di 3 hari berbeda).</p><p>${dateOf(today())}</p></div>`:""}`; }
ACT.rapor=d=>go("rapor",d.id);
SCREENS.rapor=id=>{ const k=kidOf(id); return `<div class="card">${raporHTML(k,false)}
  <button type="button" class="btn" data-a="printRapor" data-id="${k.id}">🖨️ Cetak / simpan PDF</button>
  ${D.role==="guru"?`<button type="button" class="btn wa" data-a="toHome" data-id="${k.id}">📤 Kirim tautan ke rumah</button><button type="button" class="btn ghost" data-a="sumWA" data-id="${k.id}">💬 Kirim ringkasan ke orang tua</button>`:""}
  <button type="button" class="btn ghost" data-a="${D.role==="guru"&&guruOK?"backGuru":"openKid"}" data-id="${k.id}">← Kembali</button></div>`; };
ACT.backGuru=()=>go("guru");
ACT.sumWA=d=>{ const k=kidOf(d.id), n=countStat(k); const text=`Ringkasan Kalimon ${k.name} (${dateOf(today())})\n🐾 ${bits(k.tamed)}/15 Kalimon jinak · ✅ ${n[3]+n[4]}/55 fakta lancar · ${n[4]} hafal\nLatihan 30 hari: ${sesCount(k,"k",30).length} sesi di kelas, ${sesCount(k,"r",30).length} sesi di rumah\nPerlu dilatih: ${slowest(k,4).map(factTxt).join(", ")||"–"}`;
  shareBox("Ringkasan untuk orang tua",text); };
function doPrint(html){ $("print").innerHTML=html; document.body.classList.add("printing"); setTimeout(()=>window.print(),60); }
window.addEventListener("afterprint",()=>document.body.classList.remove("printing"));
ACT.printRapor=d=>doPrint(`<div class="pg">${raporHTML(kidOf(d.id),true)}</div>`);
ACT.printRekap=()=>{ const c=curCls(); doPrint(`<div class="pg"><h1>Rekap Kalimon · ${esc(c.name)}</h1><p>${dateOf(today())}</p>${rekapHTML(c)}</div>`+c.kids.map(kidOf).filter(Boolean).map(k=>`<div class="pg">${raporHTML(k,true)}</div>`).join("")); };

/* ---------- bantuan ---------- */
$("helpBtn").onclick=()=>modal(`<h2>Cara main Kalimon</h2><ul style="padding-left:18px;line-height:1.45;margin:0">
  <li>Dari 100 kotak perkalian 1–10, jurus ×1, ×10, ×2, ×5, ×9, dan bolak-balik menyisakan <b>15 fakta inti</b>. Tiap fakta inti adalah satu <b>Kalimon</b> yang harus dijinakkan.</li>
  <li>Tiap sesi: <b>pemanasan</b> (ulang fakta lama sesuai jadwal), <b>jurus baru</b>, lalu <b>latihan</b>: 2–4 fakta baru diselipkan di antara fakta yang sudah lancar. Yang salah muncul lagi beberapa soal kemudian.</li>
  <li><b>Lancar</b> = benar dalam batas detik (biasanya 3). <b>Hafal</b> = lancar di 3 hari berbeda. Kalimon jinak kalau faktanya hafal.</li>
  <li>Ketik jawaban dengan papan angka; jawaban diperiksa begitu semua kotak terisi. Belum tahu? Tekan <b>Lewati</b>, jurusnya akan ditunjukkan.</li>
  <li><b>Di rumah</b>: 10 menit sehari, lalu tekan "Kirim kemajuan ke Kakak Guru". <b>Di kelas</b>: Kakak Guru memilih murid bergantian di HP kelas.</li>
  <li><b>Pembagian</b> dibuka Kakak Guru setelah sejumlah Kalimon jinak, lewat jurus keluarga fakta (56 : 7 = 8 karena 7 × 8 = 56).</li></ul>
  <button type="button" class="btn" data-m="close">Mengerti</button>`);

/* ---------- mulai ---------- */
function boot(){ const h=location.hash; const code=/^#[pu]=/.test(h)?h.slice(1):null;
  if(code) history.replaceState(null,"",location.pathname+location.search);
  if(!D.role&&code){ if(code[0]==="u"){ D.role="rumah"; save(); } else sessionStorage.setItem("km_pending",code); }
  homeScreen(); if(code&&D.role) handleCode(code); }
window.addEventListener("hashchange",()=>{ const h=location.hash; if(/^#[pu]=/.test(h)){ history.replaceState(null,"",location.pathname+location.search); if(G) return toast("Selesaikan sesi dulu, lalu buka tautannya lagi."); if(!D.role&&h[1]==="u"){ D.role="rumah"; save(); homeScreen(); } if(D.role) handleCode(h.slice(1)); else sessionStorage.setItem("km_pending",h.slice(1)); } });
boot();
</script>
</body>
</html>
